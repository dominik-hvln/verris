packages:
  - "apps/*"
  - "libs/*"

# PB-38 — ustawienia pnpm (od pnpm 11 tutaj, nie w .npmrc; w .npmrc zostają tylko rejestr/uwierzytelnianie).
# Magazyn pakietów: domyślny, globalny (poza repo). Magazyn w node_modules/.pnpm-store rósł z każdą
# wersją pnpm (v3, v10, v11 obok siebie) i IDE synchronizowało setki tysięcy plików po każdej instalacji.
preferOffline: true
autoInstallPeers: true
strictPeerDependencies: false
# ENV-01 — silnik deklarowany = silnik faktyczny (package.json engines, .nvmrc). Odmowa zamiast ostrzeżenia.
engineStrict: true
# Łańcuch dostaw: pnpm 12 domyślnie nie instaluje wersji świeższych niż minimalny wiek wydania.
# Nie dopisujemy wyjątków (minimumReleaseAgeExclude) — czekamy, aż wersja „odleży”.

# Od pnpm 10 skrypty instalacyjne zależności są domyślnie zablokowane — dozwolone tylko te, które ich potrzebują.
# Tylko pakiety, które bez skryptu nie działają (silniki Prismy, weryfikacja binarki esbuild, bcrypt
# z node-gyp-build). Reszta ma gotowe binarki w pakietach opcjonalnych albo czysty JS jako zapas.
allowBuilds:
  "@prisma/engines": true
  prisma: true
  esbuild: true
  bcrypt: true
  "@parcel/watcher": false
  "@swc/core": false
  cpu-features: false
  msgpackr-extract: false
  ssh2: false
  unrs-resolver: false

overrides:
  "@xhmikosr/decompress": "^11.1.3"
  piscina: "^4.9.3"
  "brace-expansion@1": "^1.1.18"
  "brace-expansion@2": "^2.1.2"
  fast-uri: "^3.1.6"
  lodash: "^4.18.1"
  "nanoid@3": "^3.3.18"
  postcss: "^8.5.26"
  "js-yaml@4": "^4.3.2"
  form-data: "^4.0.6"
  qs: "^6.15.3"
  undici: "^7.29.0"
  follow-redirects: "^1.16.0"
  dompurify: "^3.4.7"
  typescript: "^6.0.3"
  esbuild: "^0.25.0"
  body-parser: "^2.3.0"
  "@prisma/client": "7.10.0"
  deepmerge-ts: "^8.0.2"
  mysql2: "^3.24.4"
  multer: "^2.3.0"
  "js-yaml@3": "^3.15.2"
  browserslist: "^4.28.7"
