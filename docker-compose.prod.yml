# =============================================================================
# Verris — production stack (control-plane node)
# Run on the dedicated server hosting the panel + DB. Customer accounts run on
# separate compute nodes that bootstrap themselves via /servers/handshake.
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# =============================================================================

# =============================================================================
# F-8: log aggregation — every service uses the json-file driver with bounded
# retention (10 MB × 5 files = 50 MB max per container). Use `docker logs -f`
# for live tail, `docker logs --since` for historical. To ship to Loki/Grafana
# Cloud later, swap the driver to `loki` and configure `loki-url` per service.
# =============================================================================
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'
    tag: '{{.Name}}'

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-verris_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-verris} -d $${POSTGRES_DB:-verris_db}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [verris_internal]

  redis:
    image: redis:7-alpine
    restart: always
    logging: *default-logging
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [verris_internal]

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage. Holds ticket attachments, RODO
  # data exports, DPA PDFs and (in the future) generated invoices. Lives on
  # the control-plane node for now; can be moved to a dedicated storage
  # node by changing `S3_ENDPOINT` in `.env.prod` (and migrating the data
  # via `mc mirror`).
  #
  # Network: only `verris_internal` — no public access. The S3 API is
  # reachable only from the API container; the admin Console can be exposed
  # later via Caddy with `forward_auth` to /auth/grafana-validate (or kept
  # internal-only and accessed via `kubectl port-forward` / SSH tunnel).
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: always
    logging: *default-logging
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-}
    volumes:
      - minio_data:/data
    expose: ['9000', '9001']
    networks: [verris_internal]
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/minio/health/live']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # One-shot bucket bootstrapper. Runs each time the stack starts, but is
  # idempotent (`mc mb -p` succeeds if the bucket already exists). Adds a
  # 7-day lifecycle expiration for data-exports as defense-in-depth on top
  # of our app-level RetentionScheduler.
  minio-bootstrap:
    image: minio/mc:RELEASE.2025-04-03T17-07-56Z
    logging: *default-logging
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_BUCKET_BACKUPS: ${S3_BUCKET_BACKUPS:-verris-backups}
    entrypoint: >
      /bin/sh -c "
        set -e;
        mc alias set verris http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\";
        mc admin user add verris \"$$S3_ACCESS_KEY\" \"$$S3_SECRET_KEY\" || true;
        mc admin policy attach verris readwrite --user \"$$S3_ACCESS_KEY\" || true;
        mc mb -p verris/verris-ticket-attachments;
        mc mb -p verris/verris-data-exports;
        mc mb -p verris/verris-dpa-pdfs;
        mc mb -p verris/verris-invoices;
        mc mb -p verris/$$S3_BUCKET_BACKUPS;
        mc anonymous set none verris/verris-ticket-attachments;
        mc anonymous set none verris/verris-data-exports;
        mc anonymous set none verris/verris-dpa-pdfs;
        mc anonymous set none verris/verris-invoices;
        mc anonymous set none verris/$$S3_BUCKET_BACKUPS;
        mc ilm rule add --expire-days 7 verris/verris-data-exports || true;
        mc ilm rule add --expire-days 14 verris/$$S3_BUCKET_BACKUPS || true;
        echo 'MinIO buckets ready.';
      "
    restart: 'no'
    networks: [verris_internal]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: always
    logging: *default-logging
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      minio-bootstrap: { condition: service_completed_successfully }
    environment:
      NODE_ENV: production
      PORT: '3000'
      CLIENT_PANEL_URL: ${CLIENT_PANEL_URL}
      STAFF_PANEL_URL: ${STAFF_PANEL_URL}
      ADMIN_PANEL_URL: ${ADMIN_PANEL_URL}
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      APP_KMS_KEY: ${APP_KMS_KEY:?APP_KMS_KEY is required}
      # Optional: leave empty and api-entrypoint.sh builds a URL from POSTGRES_* (safe encoding).
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_USER: ${POSTGRES_USER:-verris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-verris_db}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL}
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:-}
      REDIS_URL: redis://redis:6379
      # Object storage (MinIO/S3) — see compose service `minio` above.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_REGION: ${S3_REGION:-eu-central-1}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
      S3_BUCKET_TICKET_ATTACHMENTS: ${S3_BUCKET_TICKET_ATTACHMENTS:-verris-ticket-attachments}
      S3_BUCKET_DATA_EXPORTS: ${S3_BUCKET_DATA_EXPORTS:-verris-data-exports}
      S3_BUCKET_DPA_PDFS: ${S3_BUCKET_DPA_PDFS:-verris-dpa-pdfs}
      S3_BUCKET_INVOICES: ${S3_BUCKET_INVOICES:-verris-invoices}
      S3_BUCKET_BACKUPS: ${S3_BUCKET_BACKUPS:-verris-backups}
      DATA_EXPORT_TEMP_DIR: /tmp/verris-data-exports
      SMTP_HOST: ${SMTP_HOST:-host.docker.internal}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_SECURE: ${SMTP_SECURE:-none}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-panel@verris.pl}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Verris}
      SMTP_HELO_NAME: ${SMTP_HELO_NAME:-mail.verris.pl}
      SMTP_MESSAGE_ID_DOMAIN: ${SMTP_MESSAGE_ID_DOMAIN:-verris.pl}
      # MAIL-4 — skrzynki zespołu @verris.pl (mapy Postfix na hoście; SOGo osobno)
      CONTROL_PLANE_MAIL_MAPS_DIR: ${CONTROL_PLANE_MAIL_MAPS_DIR:-/etc/postfix/verris}
      CONTROL_PLANE_MAIL_DATA_ROOT: ${CONTROL_PLANE_MAIL_DATA_ROOT:-/var/mail/vhosts}
      CONTROL_PLANE_MAIL_HOST: ${CONTROL_PLANE_MAIL_HOST:-mail.verris.pl}
      SOGO_WEB_URL: ${SOGO_WEB_URL:-https://mail.verris.pl/SOGo}
      SOGO_MYSQL_HOST: ${SOGO_MYSQL_HOST:-ops-sogo-db-1}
      SOGO_MYSQL_USER: ${SOGO_MYSQL_USER:-sogo}
      SOGO_MYSQL_DATABASE: ${SOGO_MYSQL_DATABASE:-sogo}
      SOGO_MYSQL_PASSWORD: ${SOGO_MYSQL_PASSWORD:-}
    volumes:
      - ${CONTROL_PLANE_MAIL_MAPS_DIR:-/etc/postfix/verris}:/etc/postfix/verris
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    expose: ['3000']
    networks: [verris_internal, verris_public]
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3000/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  client-panel:
    build:
      context: .
      dockerfile: Dockerfile.panel
      args:
        APP_NAME: client-panel
        APP_PORT: '3001'
        API_URL: http://api:3000
        CLIENT_PANEL_URL: ${CLIENT_PANEL_URL}
        STAFF_PANEL_URL: ${STAFF_PANEL_URL}
        ADMIN_PANEL_URL: ${ADMIN_PANEL_URL}
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
        NEXT_PUBLIC_STATUS_PAGE_URL: ${PUBLIC_STATUS_URL:-https://status.verris.pl}
    restart: always
    logging: *default-logging
    depends_on: [api]
    environment:
      NODE_ENV: production
      PORT: '3001'
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
      NEXT_PUBLIC_STATUS_PAGE_URL: ${PUBLIC_STATUS_URL:-https://status.verris.pl}
      API_URL: http://api:3000
      STAFF_PANEL_URL: ${STAFF_PANEL_URL}
      ADMIN_PANEL_URL: ${ADMIN_PANEL_URL}
    expose: ['3001']
    networks: [verris_public]
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3001/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  staff-panel:
    build:
      context: .
      dockerfile: Dockerfile.panel
      args:
        APP_NAME: staff-panel
        APP_PORT: '3002'
        API_URL: http://api:3000
        CLIENT_PANEL_URL: ${CLIENT_PANEL_URL}
        STAFF_PANEL_URL: ${STAFF_PANEL_URL}
        ADMIN_PANEL_URL: ${ADMIN_PANEL_URL}
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
        NEXT_PUBLIC_GRAFANA_URL: https://${CADDY_GRAFANA_DOMAIN:-grafana.verris.local}
    restart: always
    logging: *default-logging
    depends_on: [api]
    mem_limit: 768m
    memswap_limit: 768m
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${STAFF_PANEL_NODE_OPTIONS:---max-old-space-size=384}
      PORT: '3002'
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
      NEXT_PUBLIC_GRAFANA_URL: https://${CADDY_GRAFANA_DOMAIN:-grafana.verris.local}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      API_URL: http://api:3000
      CLIENT_PANEL_URL: ${CLIENT_PANEL_URL}
      STAFF_PANEL_URL: ${STAFF_PANEL_URL}
    expose: ['3002']
    networks: [verris_public]
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3002/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  admin-panel:
    build:
      context: .
      dockerfile: Dockerfile.panel
      args:
        APP_NAME: admin-panel
        APP_PORT: '3003'
        API_URL: http://api:3000
        CLIENT_PANEL_URL: ${CLIENT_PANEL_URL}
        STAFF_PANEL_URL: ${STAFF_PANEL_URL}
        ADMIN_PANEL_URL: ${ADMIN_PANEL_URL}
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
        NEXT_PUBLIC_STAFF_PANEL_URL: ${STAFF_PANEL_URL}
        NEXT_PUBLIC_GRAFANA_URL: https://${CADDY_GRAFANA_DOMAIN:-grafana.verris.local}
    restart: always
    logging: *default-logging
    depends_on: [api]
    mem_limit: 768m
    memswap_limit: 768m
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${ADMIN_PANEL_NODE_OPTIONS:---max-old-space-size=384}
      PORT: '3003'
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
      NEXT_PUBLIC_STAFF_PANEL_URL: ${STAFF_PANEL_URL}
      NEXT_PUBLIC_GRAFANA_URL: https://${CADDY_GRAFANA_DOMAIN:-grafana.verris.local}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      API_URL: http://api:3000
      CLIENT_PANEL_URL: ${CLIENT_PANEL_URL}
      ADMIN_PANEL_URL: ${ADMIN_PANEL_URL}
    expose: ['3003']
    networks: [verris_public]
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3003/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Public status page (status.verris.pl) — anonymous, fed by GET /status.
  # No auth, no DB cookies; the only inbound config is NEXT_PUBLIC_API_URL.
  status-page:
    build:
      context: .
      dockerfile: Dockerfile.panel
      args:
        APP_NAME: status-page
        APP_PORT: '3004'
    restart: always
    logging: *default-logging
    depends_on: [api]
    environment:
      NODE_ENV: production
      PORT: '3004'
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
      VERRIS_API_URL: http://api:3000
    expose: ['3004']
    networks: [verris_public]
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3004/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Observability stack (F-12 → F-16): Prometheus + Grafana + exporters.
  # All services are reachable only on the `verris_internal` network; Grafana
  # is exposed publicly via Caddy with `forward_auth` to /auth/grafana-validate.
  # ---------------------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: always
    logging: *default-logging
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-verris}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-verris_db}?sslmode=disable
    expose: ['9187']
    networks: [verris_internal]

  redis-exporter:
    image: oliver006/redis_exporter:v1.55.0-alpine
    restart: always
    logging: *default-logging
    depends_on:
      redis: { condition: service_healthy }
    environment:
      REDIS_ADDR: redis://redis:6379
    expose: ['9121']
    networks: [verris_internal]

  node-exporter:
    image: prom/node-exporter:v1.8.0
    restart: always
    logging: *default-logging
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    expose: ['9100']
    networks: [verris_internal]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: always
    logging: *default-logging
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose: ['8080']
    networks: [verris_internal]

  loki:
    image: grafana/loki:2.9.4
    restart: always
    logging: *default-logging
    command: ['-config.file=/etc/loki/config.yaml']
    volumes:
      - ./ops/observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    expose: ['3100']
    networks: [verris_internal]

  promtail:
    image: grafana/promtail:2.9.4
    restart: always
    logging: *default-logging
    command: ['-config.file=/etc/promtail/config.yml']
    volumes:
      - ./ops/observability/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    networks: [verris_internal]

  prometheus:
    image: prom/prometheus:v2.51.2
    restart: always
    logging: *default-logging
    entrypoint: ['/bin/sh', '-c']
    command:
      - >
        sed "s|\$${METRICS_AUTH_TOKEN}|$${METRICS_AUTH_TOKEN}|g"
        /etc/prometheus/prometheus.yml > /tmp/prometheus.yml
        && exec /bin/prometheus
        --config.file=/tmp/prometheus.yml
        --storage.tsdb.path=/prometheus
        --storage.tsdb.retention.time=30d
        --web.enable-lifecycle
    volumes:
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    environment:
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:-}
    expose: ['9090']
    depends_on: [api, postgres-exporter, redis-exporter, node-exporter, cadvisor]
    networks: [verris_internal, verris_public]

  grafana:
    image: grafana/grafana:10.4.2
    restart: always
    logging: *default-logging
    depends_on: [prometheus, loki]
    environment:
      GF_SERVER_DOMAIN: ${CADDY_GRAFANA_DOMAIN:-grafana.verris.local}
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-verris_db}
      GRAFANA_DB_RO_PASSWORD: ${GRAFANA_DB_RO_PASSWORD:?GRAFANA_DB_RO_PASSWORD is required (ALTER USER grafana_ro PASSWORD ...)}
      GF_SMTP_ENABLED: 'true'
      # Grafana smtp.host = hostname:port (one field). Do not reuse SMTP_HOST without :port.
      GF_SMTP_HOST: ${GRAFANA_SMTP_HOST:-host.docker.internal:25}
      GF_SMTP_SKIP_VERIFY: 'true'
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_ALERT_FROM_ADDRESS:-${SMTP_FROM_ADDRESS:-panel@verris.pl}}
      GF_SMTP_FROM_NAME: ${GRAFANA_ALERT_FROM_NAME:-Verris Alerts}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./ops/observability/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      # Single bind for provisioning (JSON dashboards live under provisioning/dashboards/json).
      # A second nested bind on .../dashboards/json breaks on Grafana 10+ (read-only root).
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    expose: ['3000']
    networks: [verris_internal, verris_public]
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health | grep -q ok']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Caddy is a tiny reverse-proxy that auto-issues TLS via Let's Encrypt.
  # Replace with nginx/Traefik if you prefer; the upstreams stay the same.
  caddy:
    image: caddy:2-alpine
    restart: always
    logging: *default-logging
    depends_on: [api, client-panel, staff-panel, admin-panel, status-page, grafana]
    # Caddyfile uses {$CADDY_*_DOMAIN} — must be in the container env (not only
    # compose --env-file interpolation) or Caddy falls back to *.verris.local.
    environment:
      CADDY_CLIENT_DOMAIN: ${CADDY_CLIENT_DOMAIN:-panel.verris.local}
      CADDY_STAFF_DOMAIN: ${CADDY_STAFF_DOMAIN:-staff.verris.local}
      CADDY_ADMIN_DOMAIN: ${CADDY_ADMIN_DOMAIN:-admin.verris.local}
      CADDY_API_DOMAIN: ${CADDY_API_DOMAIN:-api.verris.local}
      CADDY_STATUS_DOMAIN: ${CADDY_STATUS_DOMAIN:-status.verris.local}
      CADDY_GRAFANA_DOMAIN: ${CADDY_GRAFANA_DOMAIN:-grafana.verris.local}
      CADDY_MAIL_DOMAIN: ${CADDY_MAIL_DOMAIN:-mail.verris.local}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [verris_public]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  loki_data:
  grafana_data:

networks:
  verris_internal:   # DB + Redis — not exposed to anything else
    driver: bridge
  verris_public:     # API + panels reachable through the proxy
    driver: bridge
