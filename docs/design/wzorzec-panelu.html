<title>Verris — ekran usługi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@600;700;800&display=swap">
<style>
:root{
  --page:#f4f4ee; --surface:#ffffff; --raised:#eceee6; --line:rgba(12,26,20,.10); --line-strong:rgba(12,26,20,.18);
  --text:#0c1a14; --body:#34413a; --muted:#5f6a63;
  --accent:#0f7a52; --accent-ink:#f4f4ee; --data:#1fa871; --data-2:#6cc9a0; --data-3:#b5e3cc; --data-soft:rgba(31,168,113,.16); --data-hi:#0f7a52;
  --warn:#b7791f; --warn-soft:rgba(183,121,31,.14); --crit:#c2334f; --crit-soft:rgba(194,51,79,.12);
  --rail:#0c1a14; --rail-text:#afbdb6; --rail-hi:#f4f4ee; --rail-line:rgba(255,255,255,.08); --rail-dim:#6e7b74;
  --shadow:0 1px 0 rgba(12,26,20,.04), 0 12px 32px -18px rgba(12,26,20,.28);
  --f-display:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Hanken Grotesk","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#091410; --surface:#0e1f17; --raised:#132a1f; --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.16);
  --text:#f4f4ee; --body:#c3cec8; --muted:#8f9b94;
  --accent:#34e5a0; --accent-ink:#0c1a14; --data:#34e5a0; --data-2:#1fa871; --data-3:#1c5a40; --data-soft:rgba(52,229,160,.14); --data-hi:#5bffc0;
  --warn:#f2b84b; --warn-soft:rgba(242,184,75,.13); --crit:#fb7185; --crit-soft:rgba(251,113,133,.13);
  --rail:#0a1812; --rail-line:rgba(255,255,255,.06);
  --shadow:0 0 0 1px rgba(52,229,160,.10), 0 18px 40px -22px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --page:#091410; --surface:#0e1f17; --raised:#132a1f; --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.16);
  --text:#f4f4ee; --body:#c3cec8; --muted:#8f9b94;
  --accent:#34e5a0; --accent-ink:#0c1a14; --data:#34e5a0; --data-2:#1fa871; --data-3:#1c5a40; --data-soft:rgba(52,229,160,.14); --data-hi:#5bffc0;
  --warn:#f2b84b; --warn-soft:rgba(242,184,75,.13); --crit:#fb7185; --crit-soft:rgba(251,113,133,.13);
  --rail:#0a1812; --rail-line:rgba(255,255,255,.06);
  --shadow:0 0 0 1px rgba(52,229,160,.10), 0 18px 40px -22px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--body);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-size:12.5px;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.label{font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)}

/* ---------- boczny pasek ---------- */
.app{display:grid;grid-template-columns:252px 1fr;min-height:100%}
.rail{background:var(--rail);color:var(--rail-text);padding:16px 12px 14px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow:hidden}
.rail-scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:16px;margin:0 -6px;padding:0 6px 6px;scrollbar-width:thin;scrollbar-color:#1c3a2c transparent;-webkit-mask:linear-gradient(#000 calc(100% - 18px),transparent);mask:linear-gradient(#000 calc(100% - 18px),transparent)}
.me{flex:none;border-top:1px solid var(--rail-line);padding-top:12px}
.brand{display:flex;align-items:center;gap:10px;color:var(--rail-hi);font:800 18px/1 var(--f-display);letter-spacing:-.02em;padding:4px 8px}
.brand .logo{height:26px;width:auto;display:block}
.who{border:1px solid var(--rail-line);border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.02);width:100%;text-align:left}
.who b{display:block;color:var(--rail-hi);font:600 13.5px/1.2 var(--f-body)}
.who small{font:400 11.5px/1.2 var(--f-mono);color:#7f8c85}
.who .av{width:28px;height:28px;border-radius:6px;background:#1c3a2c;color:#5bffc0;display:grid;place-items:center;font:700 12px var(--f-display);flex:none}
.who .chev{margin-left:auto;color:var(--rail-dim)}
.nav{display:flex;flex-direction:column;gap:1px}
.nav .label{color:var(--rail-dim);padding:0 8px 6px;display:flex;justify-content:space-between;align-items:center}
.nav a,.nav button.a{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:5px;color:var(--rail-text);text-decoration:none;font-size:14px;border:0;background:none;width:100%;text-align:left}
.nav a svg,.nav button.a svg{width:16px;height:16px;flex:none;opacity:.7}
.nav a:hover,.nav button.a:hover{background:rgba(255,255,255,.04);color:var(--rail-hi)}
.nav .on{color:var(--rail-hi)!important;background:rgba(52,229,160,.08)!important;box-shadow:inset 2px 0 0 #34e5a0}
.nav em{margin-left:auto;font:400 11.5px var(--f-mono);font-style:normal;color:var(--rail-dim)}
.nav em.warn{color:#f2b84b}
.ctx{border:1px solid var(--rail-line);border-radius:10px;padding:8px 6px;background:rgba(52,229,160,.025)}
.ctx .svc{display:flex;align-items:center;gap:8px;padding:4px 6px 8px;border-bottom:1px solid var(--rail-line);margin-bottom:6px}
.ctx .svc b{color:var(--rail-hi);font:700 14px var(--f-display)}
.ctx .svc small{margin-left:auto;font:400 11px var(--f-mono);color:var(--rail-dim)}
.tree{margin:2px 0 6px 14px;border-left:1px solid var(--rail-line);padding-left:6px}
.tree .a{font-size:13.5px;padding:5px 8px}
.tree .st{width:6px;height:6px;border-radius:50%;background:#34e5a0;flex:none}
.tree .st.w{background:#f2b84b}.tree .st.n{background:#6e7b74}
.tree .a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub-label{font:500 10.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--rail-dim);padding:10px 8px 5px}
details.more summary{list-style:none;cursor:pointer}
details.more summary::-webkit-details-marker{display:none}
details.more summary .label{padding-bottom:6px}
details.more[open] summary .plus{transform:rotate(45deg)}
.plus{transition:transform .15s}
.rail .foot{font:400 11px/1.5 var(--f-mono);color:var(--rail-dim);padding:6px 8px 0}
.me{position:relative}
.me>button{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--rail-line);border-radius:8px;background:rgba(255,255,255,.02);padding:8px 10px;text-align:left;color:var(--rail-text)}
.me>button:hover{border-color:rgba(52,229,160,.3)}
.me .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#0f7a52,#34e5a0);color:#0c1a14;display:grid;place-items:center;font:800 12px var(--f-display);flex:none}
.me b{display:block;color:var(--rail-hi);font:600 13.5px/1.2 var(--f-body)}
.me small{display:block;font:400 11.5px/1.3 var(--f-mono);color:#7f8c85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.menu{position:absolute;left:0;right:0;bottom:calc(100% + 6px);background:#10241b;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:6px;box-shadow:0 18px 40px -16px rgba(0,0,0,.7);z-index:5}
.menu a,.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 9px;border:0;background:none;border-radius:6px;color:var(--rail-text);font-size:13.5px;text-decoration:none;text-align:left}
.menu a:hover,.menu button:hover{background:rgba(255,255,255,.05);color:var(--rail-hi)}
.menu svg{width:15px;height:15px;opacity:.7}
.menu hr{border:0;border-top:1px solid rgba(255,255,255,.08);margin:5px 2px}
.menu .out{color:#fb7185}
.menu-mode{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 9px 2px;font-size:13px;color:var(--rail-hi)}
.menu-mode .seg{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.1)}
.menu-mode .seg button{color:#8f9b94;padding:4px 10px}
.menu-mode .seg button[aria-pressed="true"]{background:rgba(52,229,160,.14);color:#f4f4ee}
.menu .menu-hint{margin:2px 9px 4px;font-size:11.5px;line-height:1.4;color:#7f8c85}
/* smaczek: kometa na krawędzi dymka asystenta — nierówne tempo, jak w obecnym panelu */
@property --spin{syntax:'<angle>';initial-value:0deg;inherits:false}
.comet{position:relative;isolation:isolate}
.comet::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:2;
  background:conic-gradient(from var(--spin),transparent 0 62%,color-mix(in srgb,var(--c,var(--data)) 50%,transparent) 80%,var(--c2,var(--data-hi)) 88%,transparent 93%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  opacity:var(--o,.7);animation:var(--k,comet-a) var(--d,12s) cubic-bezier(.55,.1,.35,.95) var(--dl,0s) infinite}
.comet.soft{--c:rgba(244,244,238,.5);--c2:rgba(244,244,238,.9)}
@keyframes comet-a{0%{--spin:0deg;opacity:0}8%{opacity:var(--o,.7)}45%{--spin:150deg}60%{--spin:190deg}88%{opacity:var(--o,.7)}100%{--spin:360deg;opacity:0}}
@keyframes comet-b{0%{--spin:220deg;opacity:0}12%{opacity:var(--o,.7)}50%{--spin:40deg}70%{--spin:-20deg;opacity:var(--o,.7)}100%{--spin:-140deg;opacity:0}}
@keyframes comet-c{0%{--spin:90deg;opacity:0}20%{opacity:0}30%{opacity:var(--o,.7)}65%{--spin:330deg}80%{opacity:var(--o,.7)}100%{--spin:450deg;opacity:0}}
/* słupki rosną przy wejściu, ostatni słupek ma błysk */
.bars i{animation:grow .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 45ms);transform-origin:bottom}
@keyframes grow{from{transform:scaleY(0)}}
.chart svg rect{transform-box:fill-box;transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 22ms)}
.bars i,.stack i,.days i{position:relative;overflow:hidden}
.bars i::after,.stack i::after,.days i::after{content:"";position:absolute;left:0;right:0;height:100%;bottom:0;background:linear-gradient(0deg,transparent 0,rgba(255,255,255,0) 20%,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 80%,transparent 100%);transform:translateY(100%);pointer-events:none}
.bars i:last-child::after{animation:glint 5.5s ease-in-out 1.2s infinite}
.bars i:hover::after,.bars i:focus::after,.stack i:hover::after,.stack i:focus::after,.days i:hover::after,.days i:focus::after{animation:waveup 1.5s cubic-bezier(.4,0,.6,1) infinite}
@keyframes glint{0%,70%{transform:translateY(100%)}90%,100%{transform:translateY(-100%)}}
@keyframes waveup{from{transform:translateY(100%)}to{transform:translateY(-100%)}}
/* kropki stanu oddychają, każda w swoim tempie */
.tree .st,td .s .dot,.chk i,.pill.ok .dot{--pc:52,229,160;animation:breathe 4.4s cubic-bezier(.45,0,.55,1) infinite;animation-delay:calc(var(--i,0) * -.9s)}
.chk.w i,td .s.w .dot,.tree .st.w{--pc:242,184,75}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(var(--pc),0),0 0 0 0 rgba(var(--pc),0)}50%{box-shadow:0 0 0 3px rgba(var(--pc),.14),0 0 9px 1px rgba(var(--pc),.38)}}
.days i.today{animation:today 2.6s ease-in-out infinite}
@keyframes today{50%{filter:brightness(1.35)}}
.hello{background:linear-gradient(90deg,var(--text),var(--text) 55%,var(--data-hi));-webkit-background-clip:text;background-clip:text;color:transparent}
.health{display:grid;grid-template-columns:auto 1fr auto;gap:4px 16px;align-items:center;padding:12px 16px}
.health+.health{border-top:1px solid var(--line)}
.score{font:800 28px/1 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums;min-width:52px}
.score small{font:500 11px var(--f-mono);color:var(--muted);letter-spacing:0;display:block;margin-top:3px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 9px 2px 7px;font-size:12px;color:var(--body);cursor:default}
.chk i{width:7px;height:7px;border-radius:50%;background:var(--data)}
.chk.w i{background:var(--warn)} .chk.w{border-color:color-mix(in srgb,var(--warn) 45%,transparent)}

main{min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding:12px 28px;background:color-mix(in srgb,var(--page) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);white-space:nowrap;min-width:0}
.crumb button{border:0;background:none;padding:2px 4px;border-radius:4px;color:var(--muted)}
.crumb button:hover{color:var(--text);background:var(--raised)}
.crumb b{color:var(--text);font-weight:600}
.crumb select{font:600 13.5px var(--f-body);color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:3px 6px;max-width:220px}
.search{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0;width:min(320px,34vw);padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--muted);font-size:13.5px;text-align:left}
.search span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font:500 11px var(--f-mono);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--body);background:var(--raised)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);padding:2px;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 11px;border-radius:4px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--text);font-weight:600}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);width:34px;height:34px;display:grid;place-items:center;flex:none}
.menu-btn{display:none}

.wrap{padding:24px 28px 60px;display:flex;flex-direction:column;gap:24px;max-width:1280px}

/* ---------- nagłówek ---------- */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px}
.head h1{margin:6px 0 8px;font:800 clamp(28px,4vw,40px)/1 var(--f-display);letter-spacing:-.03em;color:var(--text);text-wrap:balance;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:7px;padding:3px 9px 3px 8px;border-radius:999px;font:600 12.5px/1.4 var(--f-body);white-space:nowrap}
.pill.ok{background:var(--data-soft);color:var(--data-hi)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.n{background:var(--raised);color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

.stackchip{white-space:nowrap;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);border-radius:5px;padding:2px 8px;font:500 12.5px var(--f-mono);color:var(--text);background:var(--surface)}
.stackchip i{width:14px;height:14px;border-radius:3px;display:grid;place-items:center;font:700 9px var(--f-display);color:#fff;font-style:normal}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);padding:8px 13px;border-radius:var(--r);font-size:14px;font-weight:500;color:var(--text);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.sm{padding:5px 10px;font-size:13px}
.btn svg{width:15px;height:15px}

/* zakładki strony */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;margin-top:-6px}
.tabs button{border:0;background:none;padding:9px 12px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected="true"]{color:var(--text);font-weight:600;border-bottom-color:var(--accent)}

/* ---------- pasek liczb ---------- */
.strip{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.kpi{padding:16px 18px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.kpi+.kpi{border-left:1px solid var(--line)}
.big{font:800 30px/1 var(--f-display);letter-spacing:-.03em;color:var(--text);font-variant-numeric:tabular-nums}
.big small{font:500 13px var(--f-mono);letter-spacing:0;color:var(--muted);margin-left:4px}
.sub{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;min-height:19px}
.sub .up{color:var(--data-hi)} .sub .down{color:var(--warn)}
.stack{display:flex;height:10px;border-radius:2px;background:var(--raised);gap:2px}
.stack i{display:block;height:100%;cursor:default;transition:filter .12s,transform .12s;transform-origin:bottom}
.stack i:first-child{border-radius:2px 0 0 2px}
.stack i:hover,.stack i:focus{filter:brightness(1.2);transform:scaleY(1.5);outline:none}
.bars{display:flex;align-items:flex-end;gap:3px;height:30px}
.bars i{flex:1;background:var(--data-soft);border-radius:1px;min-height:2px;cursor:default;transition:background .1s}
.bars i:last-child{background:var(--data)}
.bars.warnlast i:last-child{background:var(--warn)}
.bars i:hover,.bars i:focus{background:var(--data-hi);outline:none}
.days{display:flex;gap:4px}
.days i{flex:1;height:14px;border-radius:2px;background:var(--data);opacity:.85;cursor:default}
.days i:hover,.days i:focus{opacity:1;transform:scaleY(1.25);outline:none}
.days i.w{background:var(--warn)}
.days i.today{outline:1.5px solid var(--text);outline-offset:1px}

/* ---------- siatka ---------- */
.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:24px;align-items:start}
.col{display:flex;flex-direction:column;gap:24px;min-width:0}
section h2{margin:0;font:700 17px/1.2 var(--f-display);letter-spacing:-.01em;color:var(--text)}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sechead p{margin:4px 0 0;font-size:13.5px;color:var(--muted);max-width:60ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}

/* tabele */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:12px 12px 10px;white-space:nowrap}
td{padding:11px 12px;border-top:1px solid var(--line);color:var(--body);vertical-align:middle}
td b{color:var(--text);font-weight:600}
td .num{white-space:nowrap}
tr.go{cursor:pointer}
tr.go:hover td{background:color-mix(in srgb,var(--raised) 55%,transparent)}
td .arrow{color:var(--muted);transition:transform .12s}
tr.go:hover .arrow{transform:translateX(3px);color:var(--accent)}
td .s{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--data-hi);white-space:nowrap}
td .s.w{color:var(--warn)} td .s.n{color:var(--muted)}
.dom{display:flex;flex-direction:column;gap:2px}
.dom small{font-size:12.5px;color:var(--muted);white-space:nowrap}
.dom b{white-space:nowrap}
.spk{display:flex;align-items:flex-end;gap:2px;height:20px;width:64px}
.spk i{flex:1;background:var(--data-soft);min-height:2px;border-radius:1px}
.spk i:last-child{background:var(--data)}

/* wykres */
.chart{padding:14px 16px 8px;position:relative}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:0 16px 14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* oś czasu */
.feed{padding:4px 0}
.day{padding:10px 16px 4px}
.ev{display:grid;grid-template-columns:18px 1fr auto;gap:12px;padding:9px 16px;align-items:start}
.ev+.ev{border-top:1px dashed var(--line)}
.ev .mk{width:9px;height:9px;border-radius:50%;margin-top:6px;border:2px solid var(--data);justify-self:center}
.ev .mk.w{border-color:var(--warn)} .ev .mk.n{border-color:var(--muted)}
.ev p{margin:0;color:var(--text);font-size:14px}
.ev small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.ev time{font:400 12px var(--f-mono);color:var(--muted);padding-top:3px}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:12.5px;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

/* asystent */
.assist{position:relative;padding:16px 16px 14px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line))}
.assist::before{content:"";position:absolute;left:22px;top:-7px;width:12px;height:12px;background:var(--surface);border-left:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));border-top:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));transform:rotate(45deg)}
.assist .who2{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.spark{width:18px;height:18px;border-radius:5px;background:var(--data-soft);display:grid;place-items:center;color:var(--data-hi)}
.assist p{margin:0 0 12px;color:var(--text);font-size:14.5px}
.assist p b{font-weight:600}
.effect{margin:0 0 12px;padding:10px 12px;border-radius:8px;background:var(--raised);font-size:13px;display:flex;gap:6px;flex-direction:column}
.effect div{display:flex;justify-content:space-between;gap:10px}
.effect s{color:var(--muted)}
.assist .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.assist .x{margin-left:auto;border:0;background:none;color:var(--muted);font-size:12.5px}

/* listy */
.list{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 16px;align-items:center}
.list li+li{border-top:1px solid var(--line)}
.list b{color:var(--text);font-weight:600;font-size:14px}
.list .m{grid-column:1;font-size:12.5px;color:var(--muted)}
.list .r{grid-row:1 / span 2;grid-column:2;text-align:right;font-size:13px}
.meter{display:block;height:5px;border-radius:3px;background:var(--raised);overflow:hidden;margin-top:6px;width:100%}
.meter i{display:block;height:100%;background:var(--data)}
.meter i.w{background:var(--warn)}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.tools button{border:0;background:var(--surface);text-align:left;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tools button:hover{background:var(--raised)}
.tools b{color:var(--text);font-size:14px;font-weight:600}
.tools small{color:var(--muted);font-size:12.5px}

.switch{position:relative;width:42px;height:24px;border-radius:999px;border:1px solid var(--line-strong);background:var(--raised);padding:0;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.switch[aria-checked="true"]{background:var(--data-soft);border-color:var(--data)}
.switch[aria-checked="true"]::after{transform:translateX(18px);background:var(--data)}
.boxhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 0}
.boxhead h3{margin:0;font:700 15px var(--f-display);color:var(--text)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:0 16px;padding:8px 16px 12px;font-size:13.5px}
.kv dt{color:var(--muted);padding:6px 0}
.kv dd{margin:0;padding:6px 0;text-align:right;color:var(--text)}
.kv dt+dd{border:0}
.kv .sep{grid-column:1/-1;border-top:1px solid var(--line);margin:4px 0}
.money{font:800 26px/1 var(--f-display);letter-spacing:-.02em;color:var(--text);font-variant-numeric:tabular-nums}
.money small{font:500 13px var(--f-mono);color:var(--muted);letter-spacing:0;margin-left:3px}
.boxfoot{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 14px}
.access{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line)}
.access div{background:var(--surface);padding:11px 16px;display:flex;flex-direction:column;gap:3px;min-width:0}
.access .v{display:flex;justify-content:space-between;gap:8px;align-items:center;color:var(--text)}
.access .v span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copy{border:0;background:none;color:var(--muted);font:500 11px var(--f-mono);padding:0;flex:none}
.copy:hover{color:var(--accent)}
.walletchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 10px;font-size:13px;color:var(--muted);white-space:nowrap}
.walletchip b{color:var(--text);font:700 13.5px var(--f-display);font-variant-numeric:tabular-nums}
.field{display:flex;flex-direction:column;gap:6px;padding:12px 16px;border-top:1px solid var(--line)}
.field label{font-size:14px;color:var(--text);font-weight:600;display:flex;justify-content:space-between}
.field small{color:var(--muted);font-size:12.5px}
.field input[type=range]{width:100%;accent-color:var(--data)}
.field input[type=number]{width:140px;padding:7px 10px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--page);color:var(--text);font:500 14px var(--f-mono)}
@media (max-width:520px){.access{grid-template-columns:1fr}.walletchip span{display:none}}
.acc{list-style:none;margin:0;padding:0 16px}
.acc li{padding:9px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.accrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.addrs{display:flex;flex-direction:column;gap:2px;min-width:0}
.addr{border:0;background:none;padding:0;text-align:left;font:500 13.5px/1.45 var(--f-mono);color:var(--text);overflow-wrap:anywhere;letter-spacing:-.01em}
.addr:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.port{flex:none;font:500 12px/1.9 var(--f-mono);color:var(--muted);background:var(--raised);border-radius:4px;padding:0 7px;white-space:nowrap}
.pro-only{display:none}
[data-mode="pro"] .pro-only{display:revert}
[data-mode="pro"] .simple-only{display:none}
.note{font:400 11.5px/1.5 var(--f-mono);color:var(--muted)}
.empty{padding:22px 16px;color:var(--muted);font-size:14px}

/* dymek podpowiedzi */
.tt{position:fixed;z-index:80;pointer-events:none;background:var(--text);color:var(--page);padding:6px 9px;border-radius:5px;font:500 12px/1.35 var(--f-mono);transform:translate(-50%,calc(-100% - 8px));white-space:nowrap;opacity:0;transition:opacity .1s}
.tt b{font:700 13px var(--f-display);display:block}
.tt.show{opacity:1}

/* paleta */
.veil{position:fixed;inset:0;background:rgba(5,12,9,.55);display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;z-index:50}
.pal{width:min(560px,100%);background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;box-shadow:0 30px 80px -30px rgba(0,0,0,.6);overflow:hidden}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:15px 16px;font:500 16px var(--f-body);color:var(--text);outline:none}
.pal ul{list-style:none;margin:0;padding:6px;max-height:340px;overflow:auto}
.pal li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;font-size:14px;color:var(--text);cursor:pointer}
.pal li small{color:var(--muted);font:400 12px var(--f-mono)}
.pal li[aria-selected="true"]{background:var(--raised)}
.pal .ai{color:var(--data-hi)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.2s;background:var(--text);color:var(--page);padding:10px 12px 10px 16px;border-radius:8px;display:flex;gap:16px;align-items:center;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:none;color:#5bffc0;font-weight:700;padding:2px 4px}
:root[data-theme="light"] .toast button{color:#5bffc0}

@media (max-width:1080px){.grid{grid-template-columns:1fr}.strip{grid-template-columns:repeat(2,1fr)}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:min(290px,86vw);z-index:40;transform:translateX(-102%);transition:transform .2s;padding-top:calc(16px + env(safe-area-inset-top,0px))}
  .app.open .rail{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
  .menu-btn{display:grid}
  .top{padding:10px 16px}.wrap{padding:20px 16px 48px}
  .search{width:auto;flex:1}.search span{display:none}.crumb{display:none}
}
@media (max-width:520px){.strip{grid-template-columns:1fr}.kpi+.kpi{border-left:0;border-top:1px solid var(--line)}.tools{grid-template-columns:1fr}.hide-sm{display:none}}

function chart(data,unit,hl){
  var W=640,H=220,L=44,R=8,T=12,B=26,mx=Math.max.apply(null,data);
  var step=mx>5000?2000:mx>500?1000:mx>50?50:mx>10?5:1, top=Math.ceil(mx/step)*step, bw=(W-L-R)/data.length;
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ruch z 30 dni">';
  for(var t=0;t<=top;t+=step){var y=T+(H-T-B)*(1-t/top);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="10.5" fill="var(--muted)">'+(t>=1000?(t/1000)+'k':t)+'</text>';}
  data.forEach(function(v,i){var h=(H-T-B)*v/top,x=L+i*bw+2,y=H-B-h,fill=i===data.length-1?'var(--data)':(i===hl?'var(--warn)':'var(--data-soft)');
    s+='<rect tabindex="0" x="'+x+'" y="'+y+'" width="'+(bw-4)+'" height="'+h+'" rx="1.5" fill="'+fill+'" data-tip="<b>'+fmt(v)+' '+unit+'</b>'+dayLabel(29-i)+(i===hl?' · 4 min przerwy':'')+'"/>';});
  [0,7,14,21,29].forEach(function(i){var d=new Date(2026,8,22-29+i);s+='<text x="'+(L+i*bw+bw/2)+'" y="'+(H-8)+'" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="10.5" fill="var(--muted)">'+d.getDate()+'.'+String(d.getMonth()+1).padStart(2,'0')+'</text>';});
  return s+'</svg>';
}

document.addEventListener('scroll',function(){tt.classList.remove('show')},true);
/* fala w górę na słupku wykresu SVG przy najechaniu */
function waveOn(e){var r=e.target;if(!r.closest||r.tagName.toLowerCase()!=='rect'||!r.closest('.chart'))return;if(!r.dataset.f)r.dataset.f=r.getAttribute('fill');r.setAttribute('fill',/warn/.test(r.dataset.f)?'url(#wave-w)':'url(#wave)');}
function waveOff(e){var r=e.target;if(r.dataset&&r.dataset.f){r.setAttribute('fill',r.dataset.f);}}
document.addEventListener('mouseover',waveOn);document.addEventListener('mouseout',waveOff);
document.addEventListener('focusin',waveOn);document.addEventListener('focusout',waveOff);

/* ================= tryb, motyw, menu ================= */
function setMode(m,announce){app.dataset.mode=m;try{localStorage.setItem('vmode',m)}catch(e){}
  if(announce){render();var mm=document.getElementById('meMenu');if(mm&&announce==='menu')mm.hidden=false;say(m==='pro'?'Widok pełny — wszystkie szczegóły techniczne':'Widok prosty — tylko to, co najważniejsze',false);}}
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-mode-set]');if(b){e.stopPropagation();setMode(b.dataset.modeSet,'menu');}},true);
try{var sm=localStorage.getItem('vmode');if(sm)setMode(sm)}catch(e){}
document.getElementById('theme').onclick=function(){var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';};
document.getElementById('wallet').onclick=function(){S.view='hosting';S.section='autoscaling';render();scrollTo(0,0)};
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('#meBtn');var m=document.getElementById('meMenu');if(!m)return;if(b){m.hidden=!m.hidden;b.setAttribute('aria-expanded',!m.hidden);}else if(!e.target.closest('#meMenu'))m.hidden=true;});
document.getElementById('menuBtn').onclick=function(){app.classList.toggle('open')};
document.addEventListener('click',function(e){if(app.classList.contains('open')&&!e.target.closest('#rail')&&!e.target.closest('#menuBtn'))app.classList.remove('open')});

/* ================= toast z cofaniem ================= */
var tmr,toast=document.getElementById('toast');
function say(msg,undo){document.getElementById('toastMsg').textContent=msg;document.getElementById('undo').hidden=!undo;toast.classList.add('show');clearTimeout(tmr);tmr=setTimeout(function(){toast.classList.remove('show')},5000);}
document.getElementById('undo').onclick=function(){toast.classList.remove('show');setTimeout(function(){say('Cofnięto',false)},220);};

/* ================= paleta „/” ================= */
var cmds=SITES.map(function(s,i){return [s.d,'strona',function(){S.view='site';S.site=i;S.tab='overview';render()}]}).concat([
 ['Utwórz skrzynkę pocztową','poczta',function(){S.view='hosting';S.section='mail';render()}],
 ['Dodaj rekord DNS','dns',function(){S.view='hosting';S.section='dns';render()}],
 ['Utwórz bazę danych','bazy',function(){S.view='hosting';S.section='db';render()}],
 ['Dodaj konto FTP','ftp',function(){S.view='hosting';S.section='ftp';render()}],
 ['Przywróć kopię zapasową','kopie',function(){S.view='hosting';S.section='backups';render()}],
 ['Zmień wersję PHP','php',null],['Dodaj domenę lub subdomenę','strony',null],['Pobierz ostatnią fakturę','płatności',null],['Zaproś osobę do zespołu','dostęp',null],
 ['Widok prosty','widok',function(){setMode('simple',1)}],['Widok pełny (szczegóły techniczne)','widok',function(){setMode('pro',1)}],
 ['Dlaczego sklep zwolnił?','asystent',null]]);
var veil=document.getElementById('veil'),q=document.getElementById('q'),list=document.getElementById('list'),sel=0,rows=[];
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ł/g,'l')}
function renderPal(){var f=norm(q.value);rows=cmds.filter(function(c){return !f||norm(c[0]+' '+c[1]).indexOf(f)>-1});
  if(f&&!rows.length)rows=[['Zapytaj asystenta: „'+q.value+'”','asystent',null]];
  sel=Math.max(0,Math.min(sel,rows.length-1));
  list.innerHTML=rows.map(function(c,i){return '<li role="option" aria-selected="'+(i===sel)+'" class="'+(c[1]==='asystent'?'ai':'')+'">'+c[0]+'<small>'+c[1]+'</small></li>'}).join('');
  list.querySelectorAll('li').forEach(function(li,i){li.onclick=function(){run(rows[i])}});}
function run(c){closePal();if(c[2]){c[2]();scrollTo(0,0)}else say(c[1]==='asystent'?'Asystent sprawdza… (w v1 odpowiedź pojawi się w dymku)':'Otwieram: '+c[0],false);}
function openPal(pre){veil.hidden=false;q.value=pre||'';sel=0;renderPal();q.focus();}
function closePal(){veil.hidden=true;}
document.getElementById('openPal').onclick=function(){openPal()};
veil.addEventListener('click',function(e){if(e.target===veil)closePal()});
q.addEventListener('input',function(){sel=0;renderPal()});
q.addEventListener('keydown',function(e){if(e.key==='ArrowDown'){sel++;renderPal();e.preventDefault()}else if(e.key==='ArrowUp'){sel--;renderPal();e.preventDefault()}else if(e.key==='Enter'&&rows[sel]){run(rows[sel])}else if(e.key==='Escape'){closePal()}});
document.addEventListener('keydown',function(e){if(e.key==='/'&&veil.hidden&&!/input|textarea|select/i.test(document.activeElement.tagName)){e.preventDefault();openPal()}});

render();
})();
</script>
