<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <title>Verris — papier firmowy (podgląd)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    @page { size: A4; margin: 20mm; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      color: #171717;
      background: #f5f5f7;
    }
    .sheet {
      width: 210mm;
      min-height: 297mm;
      margin: 16px auto;
      padding: 25mm;
      background: #fff;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }
    .head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e5e5e5;
    }
    .mark { width: 32px; height: 32px; }
    .brand { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .tagline { font-size: 12px; color: #525252; margin-top: 2px; }
    .body { margin-top: 28mm; font-size: 11pt; line-height: 1.65; min-height: 180mm; }
    .footer {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid #e5e5e5;
      font-size: 9pt;
      color: #525252;
      display: flex;
      justify-content: space-between;
    }
    @media print {
      body { background: #fff; }
      .sheet { margin: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <article class="sheet">
    <header class="head">
      <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
      </svg>
      <div>
        <div class="brand">Verris</div>
        <div class="tagline">Hosting zarządzany · panel.verris.pl</div>
      </div>
    </header>
    <main class="body">
      <p><strong>Temat / data</strong></p>
      <p>Treść pisma — zastąp ten blok w edytorze lub wyeksportuj do PDF z przeglądarki (Drukuj → Zapisz jako PDF).</p>
    </main>
    <footer class="footer">
      <span>verris.pl · kontakt@verris.pl</span>
      <span>Strona 1</span>
    </footer>
  </article>
</body>
</html>
