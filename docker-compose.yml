version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: verris_postgres
    restart: always
    environment:
      POSTGRES_USER: verris
      POSTGRES_PASSWORD: verris_password
      POSTGRES_DB: verris_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: verris_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
