version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ekohost_postgres
    restart: always
    environment:
      POSTGRES_USER: ekohost
      POSTGRES_PASSWORD: ekohost_password
      POSTGRES_DB: ekohost_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ekohost_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
