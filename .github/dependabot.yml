# CYBER-6 — ciągły nadzór nad podatnościami zależności i obrazów.
version: 2
updates:
  # Zależności JS/TS (monorepo pnpm — katalog główny).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # Aktualizacje bezpieczeństwa i patch/minor w jednym PR, by nie zasypać repo.
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, security]
    # ── Świadome wyciszenia ──────────────────────────────────────────────────
    # NIE są to wyciszenia „na zawsze". Każde ma termin przeglądu i pozycję
    # w macierzy audytu, która za nie odpowiada. Strażnik
    # apps/api/src/test/dependabot-wyciszenia.spec.ts czerwieni CI, gdy termin
    # minie — czyli przedłużenie jest decyzją, nie skutkiem tego, że nikt nie
    # zajrzał. Ta sama zasada co lista zgód w bramce podatności (X-23).
    ignore:
      # Prisma 7 to nie podniesienie wersji, tylko zmiana architektury warstwy
      # danych: `url` znika z datasource w schemacie na rzecz prisma.config.ts,
      # a PrismaClient wymaga driver adaptera. Dotyka każdej ścieżki do bazy
      # naraz — serwisu, seeda, jobów CI, testów integracyjnych i sposobu,
      # w jaki produkcja dostaje DATABASE_URL. Sprawdzone realnie: `prisma
      # generate` na 7.9.1 kończy się błędem P1012.
      # pozycja: X-20
      # przegląd: 2026-11-15
      - dependency-name: '@prisma/client'
        update-types: [version-update:semver-major]
      # pozycja: X-20
      # przegląd: 2026-11-15
      - dependency-name: prisma
        update-types: [version-update:semver-major]
      # TypeScript 7: ts-jest ma peer >=4.3 <7, typescript-eslint >=4.8.4
      # <6.1.0. Podniesienie wyłączyłoby JEDNOCZEŚNIE testy i linter — czyli
      # obie warstwy, które mają mówić, czy podniesienie się udało.
      # pozycja: X-18
      # przegląd: 2026-11-15
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # ESLint 10: `eslint-plugin-react@7.37.5` — wciągany tranzytywnie przez
      # `eslint-config-next@16.3.2` — wywraca się na dziesiątce fatalnym błędem
      # startu (kod wyjścia 2, nie 1): `Error while loading rule
      # 'react/display-name': contextOrFilename.getFilename is not a function`.
      # Zmieniło się API kontekstu reguły, wtyczka za tym nie nadążyła. Nasz kod
      # nie ma z tym nic wspólnego i nie da się tego naprawić po naszej stronie.
      # Uwaga przy przeglądzie: `eslint-config-next` deklaruje peer
      # `eslint: >=9.0.0`, czyli OBIECUJE zgodność, której jego własne
      # zależności nie mają. Peer range nie jest tu dowodem — dowodem jest
      # zielony przebieg lintera na dziesiątce.
      # pozycja: DEP-03
      # przegląd: 2026-11-15
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # `@eslint/js` 10 bez ESLinta 10 to pół migracji. Preset `recommended`
      # podnosi wtedy `no-useless-assignment` do rangi błędu — w przebiegu CI
      # PR-a #29 dało to 12 błędów w `api` — a peer `eslint: ^10.0.0` pogłębia
      # rozjazd z DEP-02: w drzewie stoją dziś OBA majory ESLinta naraz.
      # Ten pakiet wraca razem z `eslint`, nigdy osobno.
      # pozycja: DEP-03
      # przegląd: 2026-11-15
      - dependency-name: '@eslint/js'
        update-types: [version-update:semver-major]

  # Obrazy bazowe w Dockerfile'ach (api + panele).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [docker, security]

  # Akcje GitHub w workflowach.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [ci, security]
