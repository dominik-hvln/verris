# CYBER-6 — ciągły nadzór nad zależnościami i obrazami.
#
# PB-38: bez ekosystemu `npm`. Dependabot obsługuje pnpm tylko do v10 (dependabot-core#14794),
# a z pnpm 12 i dwudokumentowym pnpm-lock.yaml widzi wyłącznie paczki samego pnpm. Paczki npm
# pilnuje tygodniowy raport (ops/ci/raport-wersji.mjs, workflow raport-wersji.yml) + bramka
# podatności `pnpm audit` w CI (ops/ci/audyt-bramka.cjs). Świadome wstrzymania: ops/ci/wersje-wstrzymane.json.
version: 2
updates:
  # Obrazy bazowe w Dockerfile'ach (api + panele, MinIO budowany ze źródeł).
  - package-ecosystem: docker
    directories: ['/', '/ops/docker/minio']
    schedule:
      interval: weekly
      day: monday
    labels: [docker, security]

  # Obrazy infrastruktury w docker-compose (Postgres, Valkey, Loki, Alloy, Prometheus, Grafana…).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [docker, security]

  # Akcje GitHub w workflowach.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [ci, security]
