name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Avoid puppeteer/Chromium downloads we don't use
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  # ---------------------------------------------------------------------------
  # Install + lint + typecheck on every push/PR. Fast feedback loop.
  # ---------------------------------------------------------------------------
  static-checks:
    name: Static checks (lint + typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.5.0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @verris/database db:generate

      - name: Lint
        run: pnpm lint
        # Lint is allowed to be soft for now; typecheck below is the gate.
        continue-on-error: true

      - name: Typecheck (all workspaces via Turbo)
        run: pnpm typecheck

      - name: API unit tests (RBAC metadata + RolesGuard)
        run: pnpm --filter api test

  # ---------------------------------------------------------------------------
  # Build everything that produces a deployable artifact. Runs in parallel
  # with static-checks but reuses the pnpm cache.
  # ---------------------------------------------------------------------------
  build:
    name: Build (api + panels)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.5.0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @verris/database db:generate

      - name: Build all workspaces
        run: pnpm build

  # ---------------------------------------------------------------------------
  # Verify Prisma migrations cleanly recreate the schema on a fresh Postgres.
  # ---------------------------------------------------------------------------
  migrations:
    name: Prisma migrate deploy (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: verris
          POSTGRES_PASSWORD: verris_password
          POSTGRES_DB: verris_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verris -d verris_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://verris:verris_password@localhost:5432/verris_db?schema=public

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.5.0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations on a fresh DB
        working-directory: libs/database
        env:
          DATABASE_URL: postgresql://verris:verris_password@localhost:5432/verris_db?schema=public
        run: npx prisma migrate deploy

      - name: Confirm schema matches Prisma model (no drift)
        working-directory: libs/database
        env:
          DATABASE_URL: postgresql://verris:verris_password@localhost:5432/verris_db?schema=public
        run: npx prisma migrate status
