name: CI

# X-01 — CI musi obejmować gałęzie, na których realnie pracujemy.
# Do 2026-08-21 workflow startował wyłącznie na `main`/`master`, a praca szła na
# długo żyjących gałęziach funkcyjnych (feature/support-v2 było 301 commitów przed
# main). Efekt: CI istniało i nie dotknęło ani jednego commita z tej pracy.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Avoid puppeteer/Chromium downloads we don't use
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  # ---------------------------------------------------------------------------
  # Install + lint + typecheck on every push/PR. Fast feedback loop.
  # ---------------------------------------------------------------------------
  static-checks:
    name: Static checks (lint + typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.5.0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @verris/database db:generate

      - name: Lint
        run: pnpm lint
        # Lint is allowed to be soft for now; typecheck below is the gate.
        continue-on-error: true

      - name: Typecheck (all workspaces via Turbo)
        run: pnpm typecheck

  # ---------------------------------------------------------------------------
  # X-11 — testy API mają WŁASNY job, nie krok w „Static checks".
  #
  # Do 2026-08-21 `pnpm --filter api test` był ostatnim krokiem joba wyżej,
  # zaraz za typecheckiem. Skutek zobaczyliśmy przy pierwszym przebiegu (#17):
  # typecheck wywalił się na `apps/www` — panelu, którego ta praca w ogóle nie
  # dotyczyła — i testy nie uruchomiły się ani razu. CI działało, wszystko
  # świeciło się na czerwono z powodu literówki w typach, a jedyny krok
  # dający poziom dowodu D2 nie został wykonany.
  #
  # Zasada, którą to utrwala: krok, który DOWODZI, nie może stać za krokiem,
  # który tylko sprawdza higienę. Osobny job kosztuje jeden dodatkowy
  # `pnpm install` (~30 s) i jest tego wart.
  # ---------------------------------------------------------------------------
  api-tests:
    name: API unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.5.0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Klient Prismy jest potrzebny do samego zaimportowania modułów API.
      - name: Generate Prisma client
        run: pnpm --filter @verris/database db:generate

      - name: API unit tests
        run: pnpm --filter api test

  # ---------------------------------------------------------------------------
  # Build everything that produces a deployable artifact. Runs in parallel
  # with static-checks but reuses the pnpm cache.
  # ---------------------------------------------------------------------------
  build:
    name: Build (api + panels)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.5.0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @verris/database db:generate

      - name: Build all workspaces
        run: pnpm build

  # ---------------------------------------------------------------------------
  # Verify Prisma migrations cleanly recreate the schema on a fresh Postgres.
  # ---------------------------------------------------------------------------
  migrations:
    name: Prisma migrate deploy (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: verris
          POSTGRES_PASSWORD: verris_password
          POSTGRES_DB: verris_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verris -d verris_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://verris:verris_password@localhost:5432/verris_db?schema=public

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.5.0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations on a fresh DB
        working-directory: libs/database
        env:
          DATABASE_URL: postgresql://verris:verris_password@localhost:5432/verris_db?schema=public
        run: npx prisma migrate deploy

      - name: Confirm schema matches Prisma model (no drift)
        working-directory: libs/database
        env:
          DATABASE_URL: postgresql://verris:verris_password@localhost:5432/verris_db?schema=public
        run: npx prisma migrate status

      # Do 2026-08-22 ten job sprawdzał wyłącznie, czy migracje dają się
      # zastosować i czy schemat nie ma dryfu. Nie sprawdzał, czy DANE, które
      # migracje wstawiają, tam są i mają właściwe wartości — a Z-12 i Z-13 to
      # migracje danych, których poprawność testy jednostkowe potwierdzają
      # tylko przez czytanie SQL-a jako tekstu. Ten krok czyta bazę.
      # Seed tworzy plany prototypowe (starter/pro/business). Bez tego kroku
      # asercja „żaden prototyp nie jest publiczny" przechodziłaby trywialnie,
      # bo na bazie z samych migracji te plany nie istnieją. Przy okazji CI
      # weryfikuje, że seed w ogóle wykonuje się na świeżej bazie.
      - name: Seed reference data
        working-directory: libs/database
        env:
          DATABASE_URL: postgresql://verris:verris_password@localhost:5432/verris_db?schema=public
          SEED_ADMIN_PASSWORD: ci-not-a-real-password
        run: pnpm db:seed

      - name: Verify migrated data (Z-12, Z-13, Z-16)
        env:
          PGPASSWORD: verris_password
        run: |
          psql -h localhost -U verris -d verris_db \
               -v ON_ERROR_STOP=1 \
               -f ops/sql/sprawdz-baze-po-migracji.sql

  # ---------------------------------------------------------------------------
  # X-04 — testy integracyjne przeciwko PRAWDZIWEJ bazie.
  #
  # Wszystkie pozostałe testy API podstawiają fałszywą Prismę: dowodzą, że logika
  # jest poprawna, nie że zapytanie zwraca to, czego się po nim spodziewamy.
  # Tutaj Postgres jest prawdziwy, a fałszywe zostaje wyłącznie to, co jest
  # naprawdę na zewnątrz — DirectAdmin, poczta, dziennik audytu.
  #
  # Job NIE jest jeszcze wymagany do scalenia (ruleset z X-02). Zostanie do
  # niego dopisany po pierwszym zielonym przebiegu na main — dokładanie
  # nieprzetestowanego checka jako wymaganego zablokowałoby merge na ślepo.
  # ---------------------------------------------------------------------------
  integration:
    name: API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: verris
          POSTGRES_PASSWORD: verris_password
          POSTGRES_DB: verris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verris -d verris_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://verris:verris_password@localhost:5432/verris_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.5.0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        working-directory: libs/database
        run: npx prisma migrate deploy

      # Serwisy importują @verris/database i @verris/directadmin-sdk po ich
      # `main`, czyli z dist/. Bez tego kroku jest nie rozwiąże modułów.
      - name: Build workspace libraries
        run: pnpm --filter @verris/database --filter @verris/contracts --filter @verris/directadmin-sdk run build

      - name: Run integration tests
        working-directory: apps/api
        run: npx jest --config jest.integration.cjs

  # ---------------------------------------------------------------------------
  # CYBER-5/6 — skany bezpieczeństwa: sekrety w repo, znane CVE w zależnościach,
  # podatności w obrazach kontenerów. Nie blokują buildu (report-only na start),
  # ale dają widoczność. Podnieś do gate, gdy baza będzie czysta.
  # ---------------------------------------------------------------------------
  security-scans:
    name: Security scans (gitleaks + audit + trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # CYBER-5 — skan sekretów w historii i diffie.
      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.5.0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # CYBER-6 — znane CVE w zależnościach produkcyjnych.
      - name: pnpm audit (prod)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true

      # CYBER-6 — podatności w systemie plików (zależności + Dockerfile).
      # UWAGA na tag: to repozytorium taguje wydania z przedrostkiem `v`
      # (v0.36.0). Wersja `0.24.0` bez `v` nie istnieje — pierwszy przebieg CI
      # (run #17) wywalił się na `unable to resolve action ... unable to find
      # version 0.24.0` po dwóch sekundach, jeszcze przed checkoutem.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
