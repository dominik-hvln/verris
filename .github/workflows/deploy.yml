name: Deploy (control-plane)

# DEPLOY-1 — model „jak Vercel/Render": push na main → build obrazów w Actions →
# push do GHCR → serwer control-plane POBIERA gotowe obrazy (nie buduje u siebie),
# faza release `prisma migrate deploy`, rolling restart, health-gate + rollback.

on:
  push:
    branches: [main, master, live-release-readiness]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ---------------------------------------------------------------------------
  # 1) Build + push 5 obrazów (api + 4 panele) do GHCR, tag = git SHA + latest.
  # ---------------------------------------------------------------------------
  build-push:
    name: Build & push (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: verris-api
            dockerfile: Dockerfile.api
            build_args: ""
          - image: verris-client-panel
            dockerfile: Dockerfile.panel
            build_args: |
              APP_NAME=client-panel
              APP_PORT=3001
          - image: verris-staff-panel
            dockerfile: Dockerfile.panel
            build_args: |
              APP_NAME=staff-panel
              APP_PORT=3002
          - image: verris-admin-panel
            dockerfile: Dockerfile.panel
            build_args: |
              APP_NAME=admin-panel
              APP_PORT=3003
          - image: verris-status-page
            dockerfile: Dockerfile.panel
            build_args: |
              APP_NAME=status-page
              APP_PORT=3004
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        id: owner
        run: echo "prefix=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ steps.owner.outputs.prefix }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
            ${{ steps.owner.outputs.prefix }}/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 2) Deploy na serwer control-plane (SSH): pull obrazów → migrate deploy →
  #    rolling up --no-build → health-gate /healthz → rollback przy porażce.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to control-plane
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          command_timeout: 20m
          envs: IMAGE_TAG
          script: |
            set -Eeuo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            export IMAGE_TAG="${{ github.sha }}"
            export REGISTRY_PREFIX="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
            # Zaktualizuj repo do wdrażanego commitu ZANIM uruchomimy skrypt
            # (skrypt jest częścią tego commitu — inaczej „No such file").
            git config --global --add safe.directory "$PWD" || true
            git fetch --depth 1 origin "$IMAGE_TAG" || git fetch origin
            git checkout -f "$IMAGE_TAG"
            echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            REGISTRY_PREFIX="$REGISTRY_PREFIX" IMAGE_TAG="$IMAGE_TAG" \
              bash ops/scripts/prod-deploy-ghcr.sh
