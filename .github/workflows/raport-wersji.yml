name: Raport wersji (tygodniowy)

# PB-38 fala 4 — co poniedziałek: przestarzałe paczki npm, świadome wstrzymania, koniec wsparcia
# środowisk. Wynik w podsumowaniu przebiegu (Summary). Raport, nie bramka — bramkami są
# strażniki w testach (wersje-eol, wersje-wstrzymane) i `pnpm audit` w CI.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  raport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Raport wersji
        run: node ops/ci/raport-wersji.mjs
