name: Obraz MinIO (ze źródeł)

# PB-38 — MinIO community jest wydawany wyłącznie jako kod źródłowy, a obrazy zniknęły z Docker Huba.
# Budujemy serwer + mc z ostatniego wydania (ops/docker/minio/Dockerfile) i trzymamy w GHCR pod tagiem
# wersji. docker-compose.prod.yml wskazuje ten tag; deploy aplikacji go nie przebudowuje.
on:
  push:
    branches: [main]
    paths: ['ops/docker/minio/**', '.github/workflows/obraz-minio.yml']
  workflow_dispatch: {}

concurrency:
  group: obraz-minio
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Tag wersji z Dockerfile
        id: wersja
        run: echo "tag=$(sed -n 's/^ARG MINIO_TAG=//p' ops/docker/minio/Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ops/docker/minio
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/verris-minio:${{ steps.wersja.outputs.tag }}
          cache-from: type=gha,scope=minio
          cache-to: type=gha,mode=max,scope=minio
