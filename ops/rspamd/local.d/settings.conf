# Wysyłka z Docker / localhost (API, SOGo) — nie odrzucaj transakcji; inbound z internetu pełny skan.
# Plik local.d/settings.conf jest włączany wewnątrz bloku settings — bez drugiego "settings {".
whitelist {
  priority = 10;
  ip = ["127.0.0.0/8", "::1", "172.16.0.0/12", "10.0.0.0/8"];
  apply {
    score = -20.0;
  }
}
