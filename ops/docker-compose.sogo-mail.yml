# SOGo + MariaDB for control-plane mail (Ubuntu 24.04 — native SOGo packages unavailable).
# Usage on host: docker compose -f ops/docker-compose.sogo-mail.yml --env-file ops/sogo/.env.sogo up -d

# Limit logów jak w docker-compose.prod.yml (10 MB × 5 plików na kontener). Bez tego Docker
# pisze json-file bez rotacji, aż do zapełnienia dysku (incydent 10.11.2026: dysk panelu 99%).
# Pilnuje: apps/api/src/test/miejsce-na-dysku.spec.ts.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'
    tag: '{{.Name}}'

services:
  sogo-db:
    image: mariadb:11.4
    container_name: verris-sogo-db
    restart: unless-stopped
    logging: *default-logging
    networks:
      - sogo_internal
      - verris_internal
    environment:
      MYSQL_ROOT_PASSWORD: ${SOGO_DB_ROOT_PASSWORD:?SOGO_DB_ROOT_PASSWORD required}
      MYSQL_DATABASE: sogo
      MYSQL_USER: sogo
      MYSQL_PASSWORD: ${SOGO_DB_PASSWORD:?SOGO_DB_PASSWORD required}
    volumes:
      - sogo_mysql_data:/var/lib/mysql
    ports:
      - '127.0.0.1:3307:3306'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10

  sogo:
    image: sonroyaalmerol/docker-sogo:5.12.8-1
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      sogo-db:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - sogo_internal
      - verris_public
    volumes:
      # Paths relative to this compose file (ops/), not repo root.
      - ./sogo/runtime:/etc/sogo/sogo.conf.d:ro

volumes:
  sogo_mysql_data:

networks:
  sogo_internal:
    driver: bridge
  verris_internal:
    external: true
    name: verris_verris_internal
  verris_public:
    external: true
    name: verris_verris_public
