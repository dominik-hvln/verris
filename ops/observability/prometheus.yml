global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production
    project: verris

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: api
    metrics_path: /metrics
    scheme: http
    bearer_token: ${METRICS_AUTH_TOKEN}
    static_configs:
      - targets: ['api:3000']
        labels:
          service: control-plane

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: control-plane-host

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: docker

  # Compute fleet — node_exporter on each compute node (bootstrap.sh).
  # Targets are managed via Prometheus file-SD: API writes a JSON file on
  # disk that Prometheus reloads automatically. For now we use a static
  # placeholder; switch to file_sd_configs once the bootstrap exposes 9100.
  - job_name: nodes
    static_configs:
      - targets: []
        labels:
          service: compute-node
