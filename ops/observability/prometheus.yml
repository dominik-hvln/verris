global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production
    project: verris

# X-28 — Prometheus nie trzyma tu reguł alertowych i to jest celowe.
#
# Trzymał je do 2026-08-22 (`rule_files: /etc/prometheus/alerts.yml`) i nie miał
# ich jak wysłać: w repozytorium nie było Alertmanagera, a tu nie było sekcji
# `alerting:`. Trzynaście reguł, pięć krytycznych, zapalało się w interfejsie
# Prometheusa i na tym się kończyło. Kopia bazy nie wykonała się ani razu przez
# miesiąc i alarm o tym działał poprawnie — po prostu nie miał adresata.
#
# Reguły stoją teraz po stronie Grafany, która ma punkt kontaktowy i SMTP:
# ops/observability/grafana/provisioning/alerting/rules.yaml.
#
# Gdyby kiedyś wrócił Alertmanager, `rule_files` można przywrócić — ale RAZEM
# z sekcją `alerting:` i usługą w docker-compose.prod.yml, i trzeba wtedy
# zdecydować, gdzie reguła mieszka. Nie w dwóch miejscach naraz: pilnuje tego
# apps/api/src/test/routing-alertow.spec.ts.

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: api
    metrics_path: /metrics
    scheme: http
    bearer_token: ${METRICS_AUTH_TOKEN}
    static_configs:
      - targets: ['api:3000']
        labels:
          service: control-plane

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: control-plane-host

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: docker

  # Compute fleet — node_exporter on each compute node (bootstrap.sh).
  # Targets are managed via Prometheus file-SD: API writes a JSON file on
  # disk that Prometheus reloads automatically. For now we use a static
  # placeholder; switch to file_sd_configs once the bootstrap exposes 9100.
  - job_name: nodes
    static_configs:
      - targets: []
        labels:
          service: compute-node
