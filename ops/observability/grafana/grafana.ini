[server]
protocol = http
http_port = 3000
domain = ${GF_SERVER_DOMAIN}
root_url = %(protocol)s://%(domain)s/
serve_from_sub_path = false

[security]
admin_user = ${GF_SECURITY_ADMIN_USER}
admin_password = ${GF_SECURITY_ADMIN_PASSWORD}
disable_initial_admin_creation = false
cookie_secure = true
cookie_samesite = lax
allow_embedding = false

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_id = 1
auto_assign_org_role = Viewer

[auth]
disable_login_form = true
disable_signout_menu = false

[auth.proxy]
enabled = true
header_name = X-WEBAUTH-USER
header_property = email
auto_sign_up = true
sync_ttl = 60
whitelist =
headers = Role:X-WEBAUTH-ROLE
enable_login_token = false

[auth.basic]
enabled = false

[auth.anonymous]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false

[unified_alerting]
enabled = true

[dashboards]
# Ekran startowy = hub nawigacyjny „🏠 Verris — Start" (22-home.json, uid verris-home)
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/json/22-home.json

[log]
mode = console
level = info
