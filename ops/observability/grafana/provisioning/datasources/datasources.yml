apiVersion: 1

# X-30 — źródło danych jest ODTWARZANE, a nie aktualizowane.
#
# X-28 dopisało niżej `uid: Prometheus`, bo odwołują się do niego dwie rzeczy
# naraz: dashboardy (JSON-y mają "uid": "Prometheus") i reguły alertowe.
# To nie wystarczyło. Grafana przy provisioningu aktualizuje ISTNIEJĄCE źródło
# po NAZWIE i zostawia mu uid nadany przy pierwszym utworzeniu — czyli losowy.
#
# Skutek był taki, że wdrożenie #67 przeszło na zielono, Grafana odpowiadała
# na /api/health, trzynaście reguł było wczytanych, a wszystkie trzynaście
# waliło się co trzydzieści sekund na „data source not found". Dashboardy tego
# nie zauważyły, bo mają starą, nazwową ścieżkę zgodności; reguły alertowe
# takiej nie mają.
#
# `deleteDatasources` wykonuje się PRZED wstawieniem, więc źródło powstaje od
# nowa z uid-em z tego pliku. Kosztuje to odtworzenie rekordu przy każdym
# starcie Grafany — rekord jest w całości deklarowany tutaj, więc nie ma czego
# stracić.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: Prometheus
    access: proxy
    orgId: 1
    url: http://prometheus:9090
    isDefault: true
    version: 1
    editable: false

  # Read-only Postgres data-source (F-16). Uses the `grafana_ro` role created
  # by `0_init` migration; the password MUST be rotated after first deploy:
  #   docker compose ... exec postgres psql -U verris -d verris_db \
  #     -c "ALTER USER grafana_ro PASSWORD '<from-vault>';"
  - name: Verris-DB (RO)
    type: postgres
    access: proxy
    orgId: 1
    url: postgres:5432
    user: grafana_ro
    secureJsonData:
      password: ${GRAFANA_DB_RO_PASSWORD}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
    version: 1
    editable: false

  - name: Loki
    type: loki
    access: proxy
    orgId: 1
    url: http://loki:3100
    version: 1
    editable: false
