apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # X-28 — UID wpisany wprost, bo odwołują się do niego dwie rzeczy naraz:
    # dashboardy (JSON-y mają "uid": "Prometheus") i reguły alertowe
    # (provisioning/alerting/rules.yaml). Bez tego Grafana nadaje UID losowo,
    # a odwołanie do nieistniejącego źródła nie rzuca błędem — panel po prostu
    # jest pusty, a reguła nie ma czego policzyć.
    uid: Prometheus
    access: proxy
    orgId: 1
    url: http://prometheus:9090
    isDefault: true
    version: 1
    editable: false

  # Read-only Postgres data-source (F-16). Uses the `grafana_ro` role created
  # by `0_init` migration; the password MUST be rotated after first deploy:
  #   docker compose ... exec postgres psql -U verris -d verris_db \
  #     -c "ALTER USER grafana_ro PASSWORD '<from-vault>';"
  - name: Verris-DB (RO)
    type: postgres
    access: proxy
    orgId: 1
    url: postgres:5432
    user: grafana_ro
    secureJsonData:
      password: ${GRAFANA_DB_RO_PASSWORD}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
    version: 1
    editable: false

  - name: Loki
    type: loki
    access: proxy
    orgId: 1
    url: http://loki:3100
    version: 1
    editable: false
