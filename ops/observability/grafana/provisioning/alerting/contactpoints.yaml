# OPS-3: default ops e-mail (decyzja D-5). Requires GF_SMTP_* on Grafana service.
# PB-11 (2026-09-23): drugi kanał — Telegram. Mail idzie przez tę samą
# infrastrukturę, która może właśnie leżeć; Telegram dochodzi niezależnie.
# Oba kanały są w JEDNYM punkcie kontaktowym, więc każdy alert idzie w oba
# miejsca, a błąd jednego (np. brak tokenu) nie blokuje drugiego.
# Token i chat id: .env.prod → TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
# (docker-compose przekazuje je Grafanie jako GF_ALERT_TELEGRAM_*).
apiVersion: 1
contactPoints:
  - orgId: 1
    name: verris-ops-email
    receivers:
      - uid: verris-ops-email
        type: email
        settings:
          addresses: dominik@hvln.pl
          singleEmail: false
        disableResolveMessage: false
      - uid: verris-ops-telegram
        type: telegram
        settings:
          bottoken: $GF_ALERT_TELEGRAM_BOT_TOKEN
          chatid: $GF_ALERT_TELEGRAM_CHAT_ID
          disable_notification: false
        disableResolveMessage: false
