# ─────────────────────────────────────────────────────────────────────────────
# X-31 — kanał alertów daje znak życia (dead man's switch).
#
# Ta grupa NIE pochodzi z migracji z Prometheusa; jest dopisana ręcznie.
#
# PO CO. Kiedy wszystko działa, alerty milczą. Kiedy Grafana padnie, SMTP się
# zatka albo poczta zacznie lądować w spamie — alerty też milczą. Z zewnątrz
# oba stany wyglądają IDENTYCZNIE. To jest dokładnie ta cisza, która przez
# miesiąc znaczyła „kopia bazy jest w porządku" (H-23).
#
# Ta reguła pali się ZAWSZE i jej BRAK jest sygnałem. `vector(1)` zwraca stałą
# jedynkę, więc warunek jest spełniony przy każdej ewaluacji; gdyby Prometheus
# przestał odpowiadać, `execErrState: Alerting` zapali ją tym bardziej.
#
# Polityka powiadomień ma dla etykiety `kanal: heartbeat` osobną gałąź
# z `repeat_interval: 24h`, więc to jest JEDEN mail na dobę, a nie co cztery
# godziny jak reszta.
#
# CZEGO NIE DOWODZI. Że pozostałe reguły są poprawne — dowodzi wyłącznie, że
# droga Grafana → SMTP → skrzynka jest drożna. I ma jeden haczyk, który trzeba
# nazwać: mail, którego się nie czyta, wraca do punktu wyjścia. Jeśli po
# tygodniu przestaniesz go zauważać, ta reguła przestaje cokolwiek dawać.
# ─────────────────────────────────────────────────────────────────────────────
- orgId: 1
  name: verris_kanal_alertow
  folder: Verris
  interval: 5m
  rules:
  - uid: verris-kanal-alertow-zyje
    title: VerrisKanalAlertowZyje
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: Prometheus
      model:
        refId: A
        expr: vector(1)
        instant: true
        range: false
        editorMode: code
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
            params: []
          type: query
    for: 0s
    noDataState: Alerting
    execErrState: Alerting
    labels:
      severity: info
      kanal: heartbeat
    annotations:
      summary: Kanał alertów Verris działa — to jest znak życia, nie awaria
      description: >-
        Ta wiadomość przychodzi raz na dobę i ma przychodzić zawsze. Jeśli
        przestanie, to nie znaczy, że jest spokojnie — znaczy, że droga od
        Grafany do skrzynki gdzieś się urwała i żaden prawdziwy alarm też nie
        dojdzie. Sprawdź wtedy: kontener grafana, Postfix na panelu
        (/var/log/mail.log) i filtry na hvln.pl.
    isPaused: false

# ─────────────────────────────────────────────────────────────────────────────
# X-35 — reguły od DRUGIEJ pustki: „nie widzę", a nie „jest dobrze".
#
# Reguły warunkowe wyżej odpowiadają na pytanie „czy jest źle". Milczą, gdy
# jest dobrze — i milczały też, gdy metryki znikały, bo filtr bez próbek
# wygląda identycznie jak filtr, którego nikt nie przekroczył. To jest ta sama
# cisza, która w H-23 przez miesiąc znaczyła „kopia bazy jest w porządku".
#
# Nadkorekta z `noDataState: Alerting` (patrz komentarz przy
# verris-postgres-backup-stale) próbowała załatwić to jednym przełącznikiem
# i zamieniła jedną wadę na przeciwną. Właściwe miejsce na tę odpowiedź jest
# TUTAJ: osobna reguła, osobny opis, osobna reakcja człowieka.
#
# ILE ICH MA BYĆ. Nie trzynaście — po jednej na każdą regułę warunkową byłoby
# trzynaście maili o jednej awarii, czyli X-28 od nowa. Granicą nie jest
# reguła, tylko MIEJSCE, w którym emisja metryk może zniknąć niezależnie od
# reszty. W apps/api/src/observability/metrics.service.ts są dokładnie trzy
# takie miejsca:
#
#   • cały eksporter — /metrics API przestaje odpowiadać; zabiera ze sobą
#     wszystkie jedenaście metryk control-plane naraz;
#   • blok `if (this.objectStorage)` z własnym try/catch — MinIO nie odpowiada
#     albo storage nie jest wstrzyknięty, a `catch` tylko loguje warn;
#     verris_backup_* znikają, reszta pliku emituje się normalnie;
#   • blok `if (this.provisioningQueue && isAsync())` z własnym try/catch —
#     to samo dla metryk kolejki BullMQ.
#
# Host ma czwarte takie miejsce (textfile node_exportera) i ono ma już swojego
# strażnika: verris-security-watch-stale w grupie verris_host_security.
#
# `unless on() absent(verris_process_uptime_seconds)` w dwóch dolnych regułach
# znaczy: „zgłoś ślepotę na backup TYLKO wtedy, gdy eksporter poza tym żyje".
# Gdy padnie całe API, mówi o tym jedna reguła, a nie trzy.
#
# CZEGO TO NIE ŁAPIE — i to trzeba nazwać. Metryki liczników (np.
# verris_runtime_errors_total) mogą nie istnieć zupełnie legalnie, bo jeszcze
# nic ich nie zwiększyło. Dla nich `absent()` nie odróżnia „zero błędów" od
# „blok się nie wykonał"; jedyne, co je pilnuje, to obecność całego eksportera.
# ─────────────────────────────────────────────────────────────────────────────
- orgId: 1
  name: verris_cisza_eksporterow
  folder: Verris
  interval: 1m
  rules:
  - uid: verris-eksporter-api-niemy
    title: VerrisEksporterApiNiemy
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: Prometheus
      model:
        refId: A
        expr: absent(verris_process_uptime_seconds)
        instant: true
        range: false
        editorMode: code
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
            params: []
          type: query
    for: 5m
    noDataState: OK
    execErrState: Alerting
    labels:
      severity: critical
    annotations:
      summary: Eksporter /metrics API nie odpowiada — jedenaście reguł oślepło naraz
      description: >-
        Dopóki ta reguła się pali, cisza pozostałych reguł control-plane NIC nie
        znaczy. Sprawdź kontener api, target verris-api w Prometheusie
        (/targets) i logi API.
    isPaused: false
  - uid: verris-metryki-backupu-nieobecne
    title: VerrisMetrykiBackupuNieobecne
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: Prometheus
      model:
        refId: A
        expr: absent(verris_backup_present) unless on() absent(verris_process_uptime_seconds)
        instant: true
        range: false
        editorMode: code
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
            params: []
          type: query
    for: 20m
    noDataState: OK
    execErrState: Alerting
    labels:
      severity: critical
    annotations:
      summary: Eksporter żyje, ale przestał widzieć kopię bazy
      description: >-
        To NIE znaczy, że kopii nie ma — znaczy, że nikt jej nie sprawdza,
        a VerrisPostgresBackupStale od tej chwili milczy z niewiedzy. Dokładnie
        ta cisza znaczyła w H-23 „jest w porządku" przez miesiąc. Sprawdź MinIO,
        S3_BUCKET_BACKUPS i warn „Backup metrics skipped" w logach API.
    isPaused: false
  - uid: verris-metryki-kolejki-nieobecne
    title: VerrisMetrykiKolejkiNieobecne
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: Prometheus
      model:
        refId: A
        expr: absent(verris_provisioning_queue_oldest_waiting_seconds) unless on() absent(verris_process_uptime_seconds)
        instant: true
        range: false
        editorMode: code
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
            params: []
          type: query
    for: 20m
    noDataState: OK
    execErrState: Alerting
    labels:
      severity: warning
    annotations:
      summary: Eksporter żyje, ale przestał widzieć kolejkę provisioningu
      description: >-
        VerrisProvisioningQueueFailed i VerrisProvisioningQueueStale milczą
        z niewiedzy, nie ze spokoju. Sprawdź Redis/BullMQ i warn „Failed to
        collect provisioning queue metrics" w logach API.
    isPaused: false
