        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
            params: []
          type: query
    for: 2m
    noDataState: OK
    execErrState: Alerting
    labels:
      severity: critical
    annotations:
      summary: Bardzo wysoka liczba błędów runtime API (>50 w 5 min)
      description: 'Prawdopodobna awaria. GlitchTip: glitchtip.verris.pl, logi API (Loki).'
    isPaused: false
