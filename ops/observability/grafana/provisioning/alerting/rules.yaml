    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: Prometheus
      model:
        refId: A
        expr: verris_servers_stale_heartbeat > 0
        instant: true
        range: false
        editorMode: code
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
            params: []
          type: query
    for: 5m
    noDataState: OK
    execErrState: Alerting
    labels:
      severity: warning
    annotations:
      summary: Aktywne węzły bez heartbeat (>5 min)
