  # ───────────────────────────────────────────────────────────────────────────
  # X-35 — ta reguła paliła się przez cały czas, gdy kopia była w porządku.
  #
  # CO BYŁO. Wyrażenie brzmiało:
  #
  #     verris_backup_present == 0 or verris_backup_latest_age_seconds > 90000
  #
  # W PromQL `== 0` i `> 90000` to NIE są predykaty zwracające prawdę i fałsz.
  # To są FILTRY. Zdrowy stan (present=1, wiek 10 h) nie przechodzi przez żaden
  # z nich, więc wynikiem jest PUSTY WEKTOR — nie „zero", tylko brak próbki.
  # Grafana pustkę nazywa NoData, a ta reguła miała `noDataState: Alerting`.
  # Zdrowie było więc odczytywane jako awaria, przy każdej ewaluacji, bez końca.
  #
  # Sprawdzone na produkcji 2026-08-24:
  #     query=verris_backup_present == 0 or verris_backup_latest_age_seconds > 90000
  #     → {"resultType":"vector","result":[]}
  # przy kopii sprzed 10 h 27 min i progu 25 h. Alarm nie opisywał backupu.
  #
  # SKĄD SIĘ TAM WZIĘŁO `noDataState: Alerting`. To jest jedyna reguła w tym
  # pliku, która je miała — i akurat ta, która wcześniej sparzyła (H-23: kopia
  # nie wykonała się ani razu przez miesiąc, w ciszy). Ustawienie było
  # NADKOREKTĄ po tamtym: „niech pustka nigdy więcej nie znaczy spokoju".
  # Intencja słuszna, dźwignia niewłaściwa — bo `noDataState` nie umie odróżnić
  # dwóch przeciwnych powodów pustki:
  #
  #     pustka, bo WSZYSTKO DZIAŁA        (filtr nikogo nie przepuścił)
  #     pustka, bo METRYKI NIE MA         (eksporter padł, MinIO nie odpowiada)
  #
  # Obie docierają do Grafany jako to samo NoData. Każda wartość tego pola jest
  # więc błędna w jednym z dwóch przypadków:
  #     OK       → zdrowie czytane dobrze, martwy eksporter MILCZY (13 reguł)
  #     Alerting → martwy eksporter czytany dobrze, zdrowie ALARMUJE (ta jedna)
  # Ten plik miał obie wady naraz, każdą po innej stronie.
  #
  # ROZWIĄZANIE — nie przestawiać dźwigni, tylko przestać jej używać.
  # Wyrażenie jest teraz CAŁKOWITE: zwraca dokładnie jedną próbkę ZAWSZE.
  # `== bool 0` i `> bool 90000` dają 0/1 zamiast filtrować, `max(…)` ściąga to
  # do jednej bezetykietowej próbki, a `or vector(0)` domyka przypadek braku
  # metryki. Zdrowie to teraz jawne 0, a nie brak odpowiedzi.
  #
  #     zdrowo ............. 0 + 0 = 0     kopia stara ........ 0 + 1 = 1
  #     brak obiektu ....... 1 + 0 = 1     metryki nie ma ..... 0 + 0 = 0
  #
  # Ostatni wiersz jest celowy: „nie widzę backupu" to INNA awaria niż „backup
  # jest stary" i wymaga innej reakcji, więc ma własną regułę
  # (`verris-metryki-backupu-nieobecne`), własny opis i własny próg czasu.
  # Wpychanie obu w jedną wartość dałoby alarm, który nie mówi, co robić.
  #
  # `noDataState: OK` nie jest tu powrotem do wady 13 pozostałych reguł —
  # przy całkowitym wyrażeniu NoData jest NIEOSIĄGALNE inaczej niż przez
  # milczenie samego Prometheusa, a to łapie `execErrState` i osobny dead man's
  # switch `verris-kanal-alertow-zyje` (X-31), który pali się zawsze i którego
  # BRAK jest sygnałem. Cisza całego kanału ma jednego strażnika, nie czternastu.
  # ───────────────────────────────────────────────────────────────────────────
  - uid: verris-postgres-backup-stale
    title: VerrisPostgresBackupStale
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: Prometheus
      model:
        refId: A
        expr: (max(verris_backup_present == bool 0) or vector(0)) + (max(verris_backup_latest_age_seconds
          > bool 90000) or vector(0))
        instant: true
        range: false
        editorMode: code
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
            params: []
          type: query
    for: 30m
    noDataState: OK
    execErrState: Alerting
    labels:
      severity: critical
    annotations:
      summary: Brak świeżego backupu Postgres w MinIO (>25h)
      description: Sprawdź cron verris-backup i bucket verris-backups/postgres/ w MinIO.
    isPaused: false
