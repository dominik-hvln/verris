<!DOCTYPE html>
<!-- ==========================================================================
  Verris — customowa strona resetu hasła DirectAdmin (OPCJONALNA)
  Instalacja: /usr/local/directadmin/data/templates/custom/lost_password.html
  Wymaga lost_password=1 w directadmin.conf.

  Dokumentacja (customizing-login-page.html) wymienia tokeny: |code|,
  |message|, |username| — ale NIE opisuje pełnego przebiegu formularzy.
  ⚠ PRZED WŁĄCZENIEM NA PRODUKCJI: przejść cały flow na węźle testowym
  (żądanie resetu → mail → ustawienie nowego hasła) i dopasować pola.
  Skrypt node-da-evolution-brand.sh instaluje ten plik tylko z flagą
  --with-lost-password.
=========================================================================== -->
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Verris — reset hasła do panelu serwera</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<style>
  :root{
    --page:#091410; --card:#0e1f17; --card-2:#122619;
    --green:#0f7a52; --mid:#1fa871; --mint:#34e5a0;
    --paper:#f4f4ee; --stone:#9aa39c; --body:#afbdb6;
    --hairline:rgba(255,255,255,.08);
    --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--font);color:var(--paper);background:var(--page);
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;
    background-image:radial-gradient(1200px 600px at 15% -10%, rgba(31,168,113,.16), transparent 60%);
  }
  .wrap{width:100%;max-width:440px}
  .brand{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:28px}
  .brand .word{font-size:24px;font-weight:800;letter-spacing:-.02em}
  .brand .word small{display:block;font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--stone);margin-top:2px}
  .card{background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid var(--hairline);border-radius:32px;padding:40px 36px;box-shadow:0 24px 80px rgba(0,0,0,.45)}
  h1{font-size:20px;font-weight:700;margin-bottom:6px}
  .sub{color:var(--body);font-size:14px;line-height:1.6;margin-bottom:22px}
  label{display:block;font-size:13px;font-weight:600;color:var(--body);margin:16px 0 6px}
  input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--hairline);background:rgba(255,255,255,.04);color:var(--paper);font-size:15px;font-family:var(--font);outline:none}
  input:focus{border-color:var(--mid);box-shadow:0 0 0 3px rgba(31,168,113,.25)}
  button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:12px;cursor:pointer;background:linear-gradient(135deg,var(--mid),var(--green));color:#04120b;font-weight:700;font-size:15px;font-family:var(--font)}
  .msg{margin-top:18px;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.5;background:rgba(52,229,160,.1);border:1px solid rgba(52,229,160,.3);color:#d9ffef}
  .row{margin-top:18px;font-size:13px;text-align:center}
  a{color:var(--mint);text-decoration:none}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#34e5a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Verris">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
      </svg>
      <div class="word">Verris<small>Panel serwera</small></div>
    </div>
    <div class="card">
      <h1>Reset hasła</h1>
      <p class="sub">Podaj nazwę użytkownika — wyślemy instrukcję resetu na e-mail przypisany do konta.</p>
      <form action="/CMD_LOST_PASSWORD" method="POST" name="form">
        |*if code != ""|
        <input type="hidden" name="code" value="|code|">
        |*endif|
        <label for="username">Nazwa użytkownika</label>
        <input id="username" type="text" name="username" value="|username|" autocapitalize="none">
        |*if message != ""|
        <div class="msg">|message|</div>
        |*endif|
        <button type="submit">Wyślij instrukcję resetu</button>
      </form>
      <div class="row"><a href="/">← Wróć do logowania</a></div>
    </div>
  </div>
</body>
</html>
