# Verris control-plane mail — virtual users only (no system passwd/pam).
# Requires: comment out !include auth-system.conf.ext in 10-auth.conf (see prod-mail-dovecot-fix.sh).

auth_mechanisms = plain login
disable_plaintext_auth = no

passdb {
  driver = passwd-file
  args = /etc/postfix/verris/dovecot-passwd
}

userdb {
  driver = static
  args = uid=5000 gid=5000 home=/var/mail/vhosts/%d/%n mail=maildir:/var/mail/vhosts/%d/%n
}

service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

protocols = imap lmtp

# ssl=yes: IMAPS 993 for clients; port 143 plaintext allowed for SOGo on host.docker.internal
ssl = yes
ssl_cert = </etc/ssl/certs/ssl-cert-snakeoil.pem
ssl_key = </etc/ssl/private/ssl-cert-snakeoil.key
