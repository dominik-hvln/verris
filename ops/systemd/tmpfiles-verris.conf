# Verris — katalogi robocze kopii i odtwarzania w /tmp (control-plane).
#
# Wersjonowane w repo i instalowane przez ops/scripts/lib/miejsce-na-dysku.sh (zainstaluj_pliki_hosta_dysku)
# do /etc/tmpfiles.d/verris.conf. Sprzątanie wg wieku robi systemd-tmpfiles-clean.timer (raz na dobę).
# Ubuntu nie czyści /tmp według wieku sam z siebie (tylko przy starcie), a te katalogi przeżywają restarty
# skryptów: ops/backup-postgres.sh (staging zaszyfrowanych zrzutów, sam usuwa starsze niż 2 dni),
# ops/restore-postgres.sh i ops/scripts/restore-drill-isolated.sh (pobrane kopie; sprzątają po sobie
# pułapką EXIT — tu jest zabezpieczenie na wypadek przerwania kill -9 / restartu).
# 0700: w środku bywają zrzuty bazy z danymi osobowymi.
# Dokumentacja: man tmpfiles.d (typ „d", kolumna Age).
#
# Typ Ścieżka                      Tryb Właściciel Grupa Wiek
d     /tmp/verris-backup-staging   0700 root       root  3d
d     /tmp/verris-restore-staging  0700 root       root  1d
