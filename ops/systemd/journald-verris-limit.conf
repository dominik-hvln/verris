# Verris — limit dziennika systemd na control-plane.
#
# Wersjonowane w repo i instalowane przez ops/scripts/lib/miejsce-na-dysku.sh (zainstaluj_pliki_hosta_dysku)
# do /etc/systemd/journald.conf.d/verris-limit.conf — przy każdym deployu (idempotentnie, restart journald
# tylko przy zmianie pliku) i przez security-install-verris-security.sh --role control-plane.
#
# Incydent 10.11.2026: dziennik 3,7 GB na dysku 75 GB. Domyślny limit to 10% systemu plików (do 4 GB).
# Dokumentacja: man journald.conf (SystemMaxUse=).
[Journal]
SystemMaxUse=500M
