</div>
<script>
(function(){
  var words = ['gwiazdek.','pułapek.','dopłat.','przepłacania.','stresu.'];
  var i = 0, rot = document.getElementById('rot'), cta = document.getElementById('cta');
  setInterval(function(){
    i = (i + 1) % words.length;
    rot.classList.remove('swap'); void rot.offsetWidth;
    rot.textContent = words[i]; rot.classList.add('swap');
  }, 2500);
  setInterval(function(){
    cta.classList.remove('shake'); void cta.offsetWidth; cta.classList.add('shake');
  }, 4000);
})();
</script>
